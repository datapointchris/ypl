[project]
# The distribution, the command, the module and the repository are all `ypl`.
# uv keys a tool's receipt directory on the distribution name and pyselfupdate
# reads the running version from it, so a distribution named anything else
# installs a `ypl` whose own `update` cannot find itself.
name = "ypl"
version = "0.3.0"
description = "Organize YouTube music playlists of long DJ mixes."
authors = [{ name = "Chris Birch", email = "datapointchris@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pyselfupdate[typer]>=0.2.2",
    # The write path. Not the official Data API, which caps writes at 200/day
    # forever — see src/ypl/remote.py for why that ceiling is the wrong shape
    # for this tool. Reads go through the yt-dlp binary, which is deliberately
    # not a dependency at all — see src/ypl/ytdlp.py.
    "ytmusicapi>=1.12.1",
]

[project.scripts]
ypl = "ypl.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.8.0",
    "mypy>=1.11.2",
]

# ---------- Configurations ---------- #

[tool.codespell]
skip = '*.css.map,*.ipynb'
ignore-words-list = "astroid,aNULL,ANULL,anull"
check-filenames = true
# count = ""
# quiet-level = 3

[tool.isort]
line_length = 120
profile = "black"
atomic = true
skip = [".gitignore"]
extend_skip = [".md", ".json"]

[tool.mypy]
pretty = true
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "I",    # isort
]
ignore = [
    "SIM108",  # ternary operator — often less readable
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"env.py" = ["F401"]


[tool.ruff.lint.isort]
force-single-line = true
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.pyright]
typeCheckingMode = "standard"
analyzeUnannotatedFunctions = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
commit_message = "build(release): {version}"
# The package name is hardcoded because python-semantic-release sets no
# variable for it, and `--upgrade-package "$PACKAGE_NAME"` silently no-ops and
# ships a stale lock in the release commit.
build_command = """
    pip install uv
    uv lock --upgrade-package ypl
    git add uv.lock
"""

[tool.pytest.ini_options]
addopts = "-vv"
minversion = "8.0"
testpaths = ["tests"]

[tool.forge]
# Keys the standard owns, written by `forge dies run maintenance/sync-pyproject.sh`.
# Dropping one from the template removes it here on the next sync; a key absent
# from this list belongs to the project and is never touched. Do not hand-edit.
managed = [
    ["ruff", "line-length"],
    ["ruff", "format", "quote-style"],
    ["ruff", "format", "indent-style"],
    ["ruff", "format", "skip-magic-trailing-comma"],
    ["ruff", "format", "line-ending"],
    ["ruff", "format", "docstring-code-format"],
    ["ruff", "lint", "select"],
    ["ruff", "lint", "ignore"],
    ["ruff", "lint", "isort", "force-single-line"],
    ["ruff", "lint", "per-file-ignores", "__init__.py"],
    ["mypy", "pretty"],
    ["mypy", "ignore_missing_imports"],
    ["mypy", "check_untyped_defs"],
    ["mypy", "warn_return_any"],
    ["pyright", "typeCheckingMode"],
    ["pyright", "analyzeUnannotatedFunctions"],
    ["codespell", "check-filenames"],
    ["pytest", "ini_options", "addopts"],
    ["pytest", "ini_options", "minversion"],
    ["pytest", "ini_options", "testpaths"],
]

[build-system]
requires = ["uv_build>=0.9.13,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ypl"
# The .sql files are the schema, not fixtures — the package cannot open a
# database without them.
source-include = ["src/ypl/*.sql"]
