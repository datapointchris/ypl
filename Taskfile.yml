version: '3'

vars:
  # The CLI is tagged cli/v1.2.3, so only those tags describe its version.
  CLI_VERSION:
    sh: git describe --tags --match 'cli/v*' --always --dirty 2>/dev/null || echo dev
  INSTALL_DIR: '{{.HOME}}/.local/bin'

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # A worktree is a clean checkout, so everything gitignored is absent.
  setup:
    desc: Make a fresh checkout runnable
    cmds:
      - go -C api mod download
      - go -C cli mod download

  lint:
    desc: Lint every subsystem without writing a file
    cmds:
      - task: api:lint
      - task: cli:lint

  format:
    desc: Format every subsystem with gofumpt
    cmds:
      - task: api:format
      - task: cli:format

  test:
    desc: Test every subsystem
    cmds:
      - task: api:test
      - task: cli:test

  # ---------------------------------------------------------------------------
  # API, module github.com/datapointchris/ypl/api
  # ---------------------------------------------------------------------------

  api:build:
    desc: Build the API server to bin/ypl-api
    dir: api
    cmds:
      - go build -o ../bin/ypl-api .

  api:dev:
    desc: Run the API server from source
    dir: api
    cmds:
      - go run .

  api:test:
    desc: Run the API test suite
    dir: api
    cmds:
      - go test ./...

  # gofumpt is the formatter the commit hooks hold the code to, and -l exits 0
  # whatever it lists, so the listing itself is the verdict.
  api:lint:
    desc: Check the API's formatting, then vet and lint it
    dir: api
    cmds:
      - |
        unformatted=$(gofumpt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofumpt needed on:"; echo "$unformatted"; exit 1
        fi
      - go vet ./...
      - golangci-lint run

  api:format:
    desc: Format the API with gofumpt
    dir: api
    cmds:
      - gofumpt -w .

  # ---------------------------------------------------------------------------
  # CLI, module github.com/datapointchris/ypl/cli
  # ---------------------------------------------------------------------------

  cli:build:
    desc: Build the CLI to bin/ypl
    dir: cli
    cmds:
      - go build -ldflags "-s -w -X github.com/datapointchris/ypl/cli/internal/cli.version={{.CLI_VERSION}}" -o ../bin/ypl .

  cli:install:
    desc: Build the ypl CLI into ~/.local/bin, replacing the installed release
    dir: cli
    cmds:
      - mkdir -p {{.INSTALL_DIR}}
      - go build -ldflags "-s -w -X github.com/datapointchris/ypl/cli/internal/cli.version={{.CLI_VERSION}}" -o {{.INSTALL_DIR}}/ypl .
      - 'echo "installed ypl {{.CLI_VERSION}} -> {{.INSTALL_DIR}}/ypl"'

  cli:test:
    desc: Run the CLI test suite
    dir: cli
    cmds:
      - go test ./...

  cli:lint:
    desc: Check the CLI's formatting, then vet and lint it
    dir: cli
    cmds:
      - |
        unformatted=$(gofumpt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofumpt needed on:"; echo "$unformatted"; exit 1
        fi
      - go vet ./...
      - golangci-lint run

  cli:format:
    desc: Format the CLI with gofumpt
    dir: cli
    cmds:
      - gofumpt -w .
