version: '3'

vars:
  # The CLI is tagged cli/v1.2.3, so only those tags describe its version.
  CLI_VERSION:
    sh: git describe --tags --match 'cli/v*' --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  # A worktree is a clean checkout, so everything gitignored is absent. The
  # Python environment comes back from the lockfile, and .planning is relinked
  # to wherever the primary checkout points. PRIMARY resolves from any worktree
  # because they share one git directory, and the link is left alone where
  # there is nothing to point at.
  setup:
    desc: Make a fresh checkout runnable
    vars:
      PRIMARY:
        sh: git rev-parse --path-format=absolute --git-common-dir | sed 's|/\.git$||'
    cmds:
      - uv sync --all-extras --dev
      - '[ -L "{{.PRIMARY}}/.planning" ] && ln -sfn "$(readlink "{{.PRIMARY}}/.planning")" .planning || true'

  # ---------------------------------------------------------------------------
  # Python tool, at the repository root
  # ---------------------------------------------------------------------------

  py:test:
    desc: Run the Python test suite
    cmds:
      - uv run pytest

  py:lint:
    desc: Lint, format-check and type-check the Python tool
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy .

  # ---------------------------------------------------------------------------
  # API, module github.com/datapointchris/ypl/api
  # ---------------------------------------------------------------------------

  api:build:
    desc: Build the API server to bin/ypl-api
    dir: api
    cmds:
      - go build -o ../bin/ypl-api .

  api:run:
    desc: Run the API server
    dir: api
    cmds:
      - go run .

  api:test:
    desc: Run the API test suite
    dir: api
    cmds:
      - go test ./...

  api:lint:
    desc: Vet and lint the API
    dir: api
    cmds:
      - go vet ./...
      - golangci-lint run

  # ---------------------------------------------------------------------------
  # CLI, module github.com/datapointchris/ypl/cli
  # ---------------------------------------------------------------------------

  cli:build:
    desc: Build the CLI to bin/ypl
    dir: cli
    cmds:
      - go build -ldflags "-s -w -X github.com/datapointchris/ypl/cli/cmd.version={{.CLI_VERSION}}" -o ../bin/ypl .

  cli:test:
    desc: Run the CLI test suite
    dir: cli
    cmds:
      - go test ./...

  cli:lint:
    desc: Vet and lint the CLI
    dir: cli
    cmds:
      - go vet ./...
      - golangci-lint run

  # ---------------------------------------------------------------------------
  # Every subsystem
  # ---------------------------------------------------------------------------

  lint:
    desc: Lint every subsystem
    cmds:
      - task: py:lint
      - task: api:lint
      - task: cli:lint

  test:
    desc: Test every subsystem
    cmds:
      - task: py:test
      - task: api:test
      - task: cli:test
