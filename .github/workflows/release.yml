name: Release

on:
  push:
    branches: [main]

# Scoped per job rather than here: validate only reads, and it is the job that
# runs the most third-party code.
permissions:
  contents: read

# Two pushes to main inside one run's window would otherwise race, and the later
# run fails pushing its version bump onto a ref that has already moved.
# Never cancel-in-progress: a canceled release can leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Without this, release publishes whatever is on main, tested or not.
  #
  # Called rather than keyed off `workflow_run`, which names a workflow rather
  # than a commit: it reports only that some run finished, so a release can be
  # cut from a tree that is not the one that passed.
  validate:
    uses: ./.github/workflows/validate.yml

  # Whether this push touched the server. Publishing `:latest` restarts whatever
  # watches it, so a commit to the CLI or the Python tool must not move it. The
  # Python release beside it is already scoped the same way, by pyproject's
  # path_filters.
  changes:
    name: Read what the push changed
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.paths.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: paths
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/ypl-api:latest
        run: |
          # The base is the commit `:latest` was built from, which metadata-action
          # writes into the image as org.opencontainers.image.revision. A publish
          # that failed therefore retries on the next push, instead of waiting for
          # another api/ commit to come along, and a run that skipped stays
          # skipped because the base has not moved.
          base=$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)
          # Before the first publish there is no image to read, so fall back to
          # the push. An all-zero `before` and a force-push's unreachable one
          # cannot be diffed either, and both publish rather than skip: a
          # spurious image costs a restart, while a missing one leaves the
          # registry behind main with nothing reporting it.
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            base="$BEFORE"
          fi
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "server=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames because rename detection prints only the destination, so
          # a file moved out of api/ would read as untouched. Held in a variable
          # rather than piped: `grep -q` closes the pipe on its first match, and
          # under `pipefail` the pipeline would take git's SIGPIPE status and
          # invert the answer.
          changed=$(git diff --no-renames --name-only "$base" "$AFTER")
          if grep -qE '^(api/|\.github/workflows/release\.yml$)' <<<"$changed"; then
            echo "server=true" >>"$GITHUB_OUTPUT"
          else
            echo "server=false" >>"$GITHUB_OUTPUT"
          fi

  # The image a host pulls. It needs validate for a sharper reason than the
  # release below does: pushing `:latest` is what triggers the deploy, so a red
  # commit that built an image would be running before anyone read the run.
  image:
    name: Build and push the server image
    needs: [validate, changes]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # SHA-pinned because they are third-party and the major tag moves. The
      # login action below is handed a token with packages: write.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags a build. `:latest` is what the compose file on the host names.
      # `:sha-<short>` never moves, so a k3s manifest can name a version rather
      # than a moment, and a rollback is a manifest edit.
      - name: Resolve the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ypl-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      # The context is api/ rather than the repo root: the server is a module
      # of its own and its migrations are embedded, so nothing outside it is
      # read by the build.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: python-semantic-release/python-semantic-release@9a026e9303981c866c3425723009becb2437c757 # v10.6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The GitHub release body is the changelog. python-semantic-release
          # builds those notes from the same commits, and by a path independent
          # of the changelog file, so no CHANGELOG.md is written or tracked.
          changelog: "false"

  # The Go CLI is a nested module with its own version, tagged `cli/v1.2.3` so
  # it never collides with the Python tool's `v*` namespace. The two releases
  # are independent: pyproject's path_filters name only the paths that are the
  # Python package, and svu's --log.directory confines this one to commits
  # touching `cli/`. Neither reaches this file, so a change here releases
  # neither tool, whatever conventional type its commit carries.
  #
  # svu rather than python-semantic-release's Go sibling, because
  # go-semantic-release hardcodes the tag prefix to `v` and parses candidate
  # tags as bare semver — it can neither write `cli/v0.2.0` nor read the
  # `cli/v0.1.0` it would bump from. Monorepo support there is closed wontfix.
  version:
    name: Resolve the CLI version
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      previous: ${{ steps.resolve.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
      - run: go install github.com/caarlos0/svu/v3@v3.4.1

      # --v0 keeps a breaking change on a 0.x line a minor bump. Reaching 1.0
      # states that the interface is stable, which is a decision to take
      # deliberately rather than one the next `feat!:` takes on its own.
      #
      # svu only prints a version, and prints the current one unchanged when
      # nothing under cli/ is releasable. That equality is what gates the two
      # jobs below.
      #
      # svu exits 1 when no tag matches --tag.pattern, so it cannot name the
      # first release: there is no version for it to bump. That case is decided
      # here instead, at cli/v0.1.0 — the version svu itself starts a repo at.
      # The condition is the absent tag rather than a failed svu, because
      # treating any svu failure as a first release turns a broken run into a
      # published one.
      #
      # The bump is read from the branch's own commit subjects. svu skips merge
      # commits, and this repository merges rather than squashes, so the PR
      # title lands on a commit svu never reads. A PR titled `feat(cli):` whose
      # commits are all `chore:` or `refactor:` merges green and cuts nothing.
      - name: Resolve the next version
        id: resolve
        run: |
          previous=$(git tag --list 'cli/v*' --sort=-version:refname | head -1)
          echo "previous=${previous}" >>"$GITHUB_OUTPUT"
          if [ -z "$previous" ]; then
            next='cli/v0.1.0'
          else
            next=$(svu next --tag.pattern 'cli/v*' --tag.prefix 'cli/v' --log.directory cli --v0)
            if [ "$next" = "$previous" ]; then
              echo "No releasable commits under cli/ since ${previous}"
              exit 0
            fi
          fi
          echo "Releasing ${next} (previous: ${previous:-none})"
          echo "tag=${next}" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod

      # The archive name is `ypl_<version>_<os>_<arch>`. goselfupdate, which
      # `ypl update` runs, matches the OS and the Go arch as delimited words in
      # an asset's name, so the underscores are what make an asset findable.
      # CGO off so the binary runs on a machine without the build host's libc.
      - name: Build and archive
        working-directory: cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG#cli/}"
          version_num="${version#v}"
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/datapointchris/ypl/cli/internal/cli.version=${version}" \
            -o ../dist/ypl .
          tar -czf "../dist/ypl_${version_num}_${GOOS}_${GOARCH}.tar.gz" -C ../dist ypl
          rm ../dist/ypl

      - uses: actions/upload-artifact@v7
        with:
          name: ypl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the CLI release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: ypl-*
          path: dist
          merge-multiple: true

      # `--` rather than `./*`: both stop a leading-dash filename being read as
      # an option, but sha256sum echoes its argument verbatim, so `./*` writes
      # every entry as ./name while the release asset is named name.
      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz > checksums.txt

      # Not `generate_release_notes`, which lists merged PRs since the last
      # published release — and the last published release here is usually the
      # Python tool's, so it would list every PR since that instead.
      - name: Build release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          range="${PREVIOUS:+${PREVIOUS}..}HEAD"
          {
            echo '## Changes'
            echo
            git log --no-merges --pretty='- %s (%h)' "$range" -- cli
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "**Full changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${TAG}"
            fi
          } >release-notes.md
          cat release-notes.md

      # Creates the tag as well as the release, at the commit being built. A tag
      # pushed with GITHUB_TOKEN cannot trigger another workflow, so tagging in
      # one job and firing the build on the tag would never run at all.
      # SHA-pinned because it is third-party, the major tag moves, and this job
      # holds contents: write.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: release-notes.md
          # A repository has one Latest release however many tag streams it
          # publishes, and the API defaults every new release to it. The CLI
          # releases far more often than the Python tool, so without this
          # `/releases/latest` and the badge on the repository page would answer
          # `cli/v*` — and README's install line tells a reader to install the
          # Python package from the newest release tag.
          make_latest: 'false'
