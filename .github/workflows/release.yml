name: Release

on:
  push:
    branches: [main]

# Scoped per job rather than here: validate only reads, and it is the job that
# runs the most third-party code.
permissions:
  contents: read

# Two pushes to main inside one run's window would otherwise race, and the later
# run fails pushing its version bump onto a ref that has already moved.
# Never cancel-in-progress: a canceled release can leave a tag with no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Without this, release publishes whatever is on main, tested or not.
  validate:
    uses: ./.github/workflows/validate.yml

  # Whether this push touched the server. Publishing `:latest` restarts whatever
  # watches it, so a commit to the CLI or the Python tool must not move it. The
  # Python release beside it is already scoped the same way, by pyproject's
  # path_filters.
  changes:
    name: Read what the push changed
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.paths.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: paths
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/ypl-api:latest
        run: |
          # The base is the commit `:latest` was built from, which metadata-action
          # writes into the image as org.opencontainers.image.revision. A publish
          # that failed therefore retries on the next push, instead of waiting for
          # another api/ commit to come along, and a run that skipped stays
          # skipped because the base has not moved.
          base=$(docker buildx imagetools inspect "$IMAGE" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)
          # Before the first publish there is no image to read, so fall back to
          # the push. An all-zero `before` and a force-push's unreachable one
          # cannot be diffed either, and both publish rather than skip: a
          # spurious image costs a restart, while a missing one leaves the
          # registry behind main with nothing reporting it.
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            base="$BEFORE"
          fi
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "server=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames because rename detection prints only the destination, so
          # a file moved out of api/ would read as untouched. Held in a variable
          # rather than piped: `grep -q` closes the pipe on its first match, and
          # under `pipefail` the pipeline would take git's SIGPIPE status and
          # invert the answer.
          changed=$(git diff --no-renames --name-only "$base" "$AFTER")
          if grep -qE '^(api/|\.github/workflows/release\.yml$)' <<<"$changed"; then
            echo "server=true" >>"$GITHUB_OUTPUT"
          else
            echo "server=false" >>"$GITHUB_OUTPUT"
          fi

  # The image a host pulls. It needs validate for a sharper reason than the
  # release below does: pushing `:latest` is what triggers the deploy, so a red
  # commit that built an image would be running before anyone read the run.
  image:
    name: Build and push the server image
    needs: [validate, changes]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # SHA-pinned because they are third-party and the major tag moves. The
      # login action below is handed a token with packages: write.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags a build. `:latest` is what the compose file on the host names.
      # `:sha-<short>` never moves, so a k3s manifest can name a version rather
      # than a moment, and a rollback is a manifest edit.
      - name: Resolve the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/ypl-api
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      # The context is api/ rather than the repo root: the server is a module
      # of its own and its migrations are embedded, so nothing outside it is
      # read by the build.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: python-semantic-release/python-semantic-release@9a026e9303981c866c3425723009becb2437c757 # v10.6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The GitHub release body is the changelog. python-semantic-release
          # builds those notes from the same commits, and by a path independent
          # of the changelog file, so no CHANGELOG.md is written or tracked.
          changelog: "false"
