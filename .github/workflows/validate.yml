# forge-toolchain: 23
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:

  go-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:

      - uses: actions/checkout@v7

      # > custom:before:go-api - yt-dlp for the test that hands it a read's arguments
      # The API reads videos by running yt-dlp, and one test hands the real
      # binary the arguments a read passes, so that an option yt-dlp does not
      # take is red here rather than on the deployed host. That test skips when
      # yt-dlp is absent, which without this step is everywhere.
      #
      # The release is the one the image pins, read from the Dockerfile so one
      # edit moves both. The tag writes 2026.08.19 and PyPI 2026.8.19.
      - name: Install the yt-dlp the image ships
        run: |
          tag=$(sed -n 's|.*yt-dlp/releases/download/\([0-9.]*\)/.*|\1|p' Dockerfile | head -n 1)
          if [ -z "$tag" ]; then
            echo "::error file=api/Dockerfile::no yt-dlp release is pinned by URL"
            exit 1
          fi
          pipx install "yt-dlp==$(echo "$tag" | awk -F. '{ printf "%d.%d.%d", $1, $2, $3 }')"

      # generated:go-api
      - uses: actions/setup-go@v7
        with:
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          go-version-file: "api/go.mod"
          cache: true
          cache-dependency-path: "api/go.sum"

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./...

      # --allow-parallel-runners because a repo with two Go components runs two
      # of these jobs at once, and golangci-lint takes a lock on its shared
      # cache under $HOME. A hosted runner gives each job its own machine, so
      # they never meet; a self-hosted one is a single box and the second job
      # dies with "parallel golangci-lint is running" and exit 3. The flag makes
      # it wait for the lock instead.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          golangci-lint run --allow-parallel-runners

      # Two classes of advisory this catches and a lockfile scan does not. An
      # unmaintained transitive dependency reaches a repo through something it
      # imports rather than through anything it declares. And the `go` directive
      # picks the toolchain that compiles the binary, so a stale one takes a
      # stale standard library with it.
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      # > custom:after:go-api - sqlc generated code matches its queries and migrations
      #
      # A query or migration edit committed without regenerating still builds
      # and tests clean. The sqlc version is the tool directive pinned in go.mod.
      - name: Check sqlc generated code is current
        run: cd store && go tool sqlc diff

  go-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:

      - uses: actions/checkout@v7

      # generated:go-cli
      - uses: actions/setup-go@v7
        with:
          # Action inputs resolve from the workspace root, not the job's
          # working-directory, so this needs the component path.
          go-version-file: "cli/go.mod"
          cache: true
          cache-dependency-path: "cli/go.sum"

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./...

      # --allow-parallel-runners because a repo with two Go components runs two
      # of these jobs at once, and golangci-lint takes a lock on its shared
      # cache under $HOME. A hosted runner gives each job its own machine, so
      # they never meet; a self-hosted one is a single box and the second job
      # dies with "parallel golangci-lint is running" and exit 3. The flag makes
      # it wait for the lock instead.
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1
          golangci-lint run --allow-parallel-runners

      # Two classes of advisory this catches and a lockfile scan does not. An
      # unmaintained transitive dependency reaches a repo through something it
      # imports rather than through anything it declares. And the `go` directive
      # picks the toolchain that compiles the binary, so a stale one takes a
      # stale standard library with it.
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
